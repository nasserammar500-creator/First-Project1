<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">💰 Expense Tracker</a>
    </div>
  </nav>

  <div class="container mb-5">
    
    <div id="alert-container"></div>

   <div class="summary-grid">
        <div>
          <div class="card text-white bg-success shadow-sm h-100">
            <div class="card-body text-center">
              <h6 class="card-title text-white-50">Total Expense</h6>
              <h3 class="card-text fw-bold" id="total-amount">0.00 JOD</h3>
            </div>
          </div>
        </div>
        <div>
          <div class="card text-white bg-info shadow-sm h-100">
            <div class="card-body text-center">
              <h6 class="card-title text-white-50">Expense Count</h6>
              <h3 class="card-text fw-bold" id="total-count">0</h3>
            </div>
          </div>
        </div>
        <div>
          <div class="card text-white bg-warning shadow-sm h-100">
            <div class="card-body text-center">
              <h6 class="card-title text-dark-50">Highest Expense</h6>
              <h3 class="card-text fw-bold text-dark" id="highest-expense">0.00 JOD</h3>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">

      <div class="col-md-8">
        <div class="card shadow-sm p-3">
          <h5 class="fw-bold mb-3">Add New Expense</h5>
          <form id="add-expense-form" class="row g-2">
            <div class="col-md-4">
              <input type="text" id="add-title" class="form-control" placeholder="Title (e.g. Lunch)" required>
            </div>
            <div class="col-md-3">
              <input type="number" step="0.01" id="add-amount" class="form-control" placeholder="Amount" required min="0.01">
            </div>
            <div class="col-md-3">
              <select id="add-category" class="form-select" required>
                <option value="" disabled selected>Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm p-3 h-100 justify-content-center">
          <h5 class="fw-bold mb-2">Filter by Category</h5>
          <select id="filter-category" class="form-select">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
    </div>

    <div id="loading-spinner" class="text-center my-5 d-none">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted">Loading data...</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="card-title mb-0 fw-bold">Expenses List</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">#</th>
                <th scope="col">Title</th>
                <th scope="col">Amount</th>
                <th scope="col">Category</th>
                <th scope="col">Date</th>
                <th scope="col" class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="expenses-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="edit-expense-form">
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id" />

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="edit-title" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="edit-amount" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-control" id="edit-category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="edit-date" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
